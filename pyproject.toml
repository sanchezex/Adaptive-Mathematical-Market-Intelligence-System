[project]
name = "ammis"
version = "0.1.0"
description = "Adaptive Mathematical Market Intelligence System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AMMIS"}]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.poetry]
name = "ammis"
version = "0.1.0"
description = "Adaptive Mathematical Market Intelligence System"
authors = ["AMMIS <team@example.com>"]
readme = "README.md"
packages = [{include = "ammis"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pydantic = "^2.8.2"
psycopg = {version = "^3.2.1", extras = ["binary"]}
redis = "^5.0.8"
sqlalchemy = "^2.0.32"

numpy = "^2.0.1"
pandas = "^2.2.2"
scipy = "^1.14.0"
scikit-learn = "^1.5.1"

statsmodels = "^0.14.2"
PyWavelets = "^1.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.5.7"
black = "^24.8.0"
mypy = "^1.11.2"

[tool.poetry.scripts]
ammis-api = "ammis.api.main:app"

