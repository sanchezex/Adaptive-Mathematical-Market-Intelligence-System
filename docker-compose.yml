version: '3.8'
services:
  backend:
    image: python:3.11-slim
    container_name: ammis-backend
    working_dir: /app
    volumes:
      - ./:/app:cached
    environment:
      - AMMIS_DB_HOST=timescaledb
      - AMMIS_DB_PORT=5432
      - AMMIS_DB_NAME=ammis
      - AMMIS_DB_USER=postgres
      - AMMIS_DB_PASSWORD=postgres
      - AMMIS_RUN_MIGRATIONS=1
    command: bash -c "pip install -r requirements.txt && if [ \"$AMMIS_RUN_MIGRATIONS\" = \"1\" ]; then python3 scripts/run_migrations.py; fi && uvicorn ammis.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - '8000:8000'
    depends_on:
      - timescaledb
      - redis

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: ammis-timescaledb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ammis
    ports:
      - '5432:5432'
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ammis-redis
    ports:
      - '6379:6379'

  prometheus:
    image: prom/prometheus:latest
    container_name: ammis-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:latest
    container_name: ammis-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3000:3000'

volumes:
  timescale_data:
  grafana_data:
